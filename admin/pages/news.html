<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News & Updates | BKR Admin Panel</title>
    <link rel="stylesheet" href="../../css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="admin-container">
        <!-- Sidebar -->
        <aside class="admin-sidebar">
            <div class="sidebar-header">
                <h2>B<span>K</span>R</h2>
                <p>Admin Panel</p>
            </div>
            
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">
                    <i class="fas fa-tachometer-alt"></i>
                    <span>Dashboard</span>
                </a>
                <a href="health-camps.html" class="nav-item">
                    <i class="fas fa-heartbeat"></i>
                    <span>Health Camps</span>
                </a>
                <a href="gallery.html" class="nav-item">
                    <i class="fas fa-images"></i>
                    <span>Gallery</span>
                </a>
                <a href="news.html" class="nav-item active">
                    <i class="fas fa-newspaper"></i>
                    <span>News & Updates</span>
                </a>
                <a href="complaints.html" class="nav-item">
                    <i class="fas fa-exclamation-circle"></i>
                    <span>Complaints</span>
                </a>
                <a href="feedback.html" class="nav-item">
                    <i class="fas fa-comment-dots"></i>
                    <span>Feedback</span>
                </a>
                <a href="content.html" class="nav-item">
                    <i class="fas fa-edit"></i>
                    <span>Content</span>
                </a>
                <a href="settings.html" class="nav-item">
                    <i class="fas fa-cog"></i>
                    <span>Settings</span>
                </a>
            </nav>
            
            <div class="sidebar-footer">
                <a href="#" onclick="logout()">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Logout</span>
                </a>
            </div>
        </aside>
        
        <!-- Main Content -->
        <main class="admin-main">
            <!-- Header -->
            <header class="admin-header">
                <div class="header-left">
                    <h1>News & Updates</h1>
                    <p>Manage news articles and announcements</p>
                </div>
                <div class="header-right">
                    <button class="btn btn-secondary" data-modal="addNewsModal">
                        <i class="fas fa-plus"></i> Add News Article
                    </button>
                </div>
            </header>
            
            <!-- Content -->
            <div class="admin-content">
                <!-- Filters -->
                <div class="admin-card">
                    <div class="card-body">
                        <div style="display: flex; gap: 20px; align-items: center; flex-wrap: wrap;">
                            <div class="search-box">
                                <i class="fas fa-search"></i>
                                <input type="text" placeholder="Search news...">
                            </div>
                            <select class="form-control" style="width: auto;">
                                <option value="">All Categories</option>
                                <option value="announcement">Announcements</option>
                                <option value="event">Events</option>
                                <option value="press">Press Releases</option>
                                <option value="update">Updates</option>
                            </select>
                            <select class="form-control" style="width: auto;">
                                <option value="">All Status</option>
                                <option value="published">Published</option>
                                <option value="draft">Draft</option>
                            </select>
                        </div>
                    </div>
                </div>
                
                <!-- News Table -->
                <div class="admin-card">
                    <div class="card-header">
                        <h3>News Articles</h3>
                    </div>
                    <div class="card-body">
                        <table class="admin-table">
                            <thead>
                                <tr>
                                    <th>Title</th>
                                    <th>Category</th>
                                    <th>Date</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="newsTable">
                                <tr>
                                    <td colspan="5" style="text-align: center;">No news articles found.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Add News Modal -->
    <div class="modal-overlay" id="addNewsModal">
        <div class="modal" style="max-width: 700px;">
            <div class="modal-header">
                <h3>Add News Article</h3>
                <button class="modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <form id="newsForm">
                    <div class="form-group">
                        <label>Title *</label>
                        <input type="text" class="form-control" name="title" placeholder="Enter article title" required>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label>Category *</label>
                            <select class="form-control" name="category" required>
                                <option value="">Select Category</option>
                                <option value="announcement">Announcement</option>
                                <option value="event">Event</option>
                                <option value="press">Press Release</option>
                                <option value="update">Update</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Date *</label>
                            <input type="date" class="form-control" name="date" required>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label>Summary *</label>
                        <textarea class="form-control" name="summary" rows="3" placeholder="Brief summary of the article..." required></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label>Content *</label>
                        <textarea class="form-control" name="content" rows="8" placeholder="Full article content..." required></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label>Featured Image URL (Optional)</label>
                        <input type="text" class="form-control" name="image" placeholder="https://example.com/image.jpg">
                    </div>
                    
                    <div class="form-group">
                        <label>Status</label>
                        <div style="display: flex; gap: 20px; margin-top: 10px;">
                            <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                                <input type="radio" name="status" value="published" checked>
                                <span>Published</span>
                            </label>
                            <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                                <input type="radio" name="status" value="draft">
                                <span>Draft</span>
                            </label>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline modal-cancel">Cancel</button>
                <button type="submit" form="newsForm" class="btn btn-secondary">
                    <i class="fas fa-plus"></i> Publish Article
                </button>
            </div>
        </div>
    </div>

    <script src="../../js/admin.js"></script>
    <script>
        // Check authentication
        if (localStorage.getItem('adminLoggedIn') !== 'true') {
            window.location.href = 'login.html';
        }
        
        function logout() {
            localStorage.removeItem('adminLoggedIn');
            localStorage.removeItem('adminUser');
            window.location.href = 'login.html';
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            loadNews();
        });
        
        function loadNews() {
            const container = document.getElementById('newsTable');
            const news = JSON.parse(localStorage.getItem('news') || '[]');
            
            if (news.length === 0) {
                container.innerHTML = '<tr><td colspan="5" style="text-align:center;">No news articles found. Add a new article to get started.</td></tr>';
                return;
            }
            
            container.innerHTML = news.map(item => `
                <tr>
                    <td><strong>${item.title}</strong></td>
                    <td><span class="badge badge-primary">${item.category}</span></td>
                    <td>${item.date}</td>
                    <td>
                        <span class="badge ${item.status === 'published' ? 'badge-success' : 'badge-warning'}">
                            ${item.status === 'published' ? 'Published' : 'Draft'}
                        </span>
                    </td>
                    <td class="actions">
                        <button class="btn btn-sm btn-info" onclick="viewNews(${item.id})">
                            <i class="fas fa-eye"></i>
                        </button>
                        <button class="btn btn-sm btn-primary" onclick="editNews(${item.id})">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button class="btn btn-sm btn-danger" onclick="deleteNews(${item.id})">
                            <i class="fas fa-trash"></i>
                        </button>
                    </td>
                </tr>
            `).join('');
        }
        
        function deleteNews(id) {
            if (!confirm('Are you sure you want to delete this news article?')) return;
            
            const news = JSON.parse(localStorage.getItem('news') || '[]');
            const filtered = news.filter(n => n.id !== id);
            localStorage.setItem('news', JSON.stringify(filtered));
            
            showNotification('News article deleted successfully!', 'success');
            loadNews();
        }
        
        // Form submission
        document.getElementById('newsForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());
            
            const news = JSON.parse(localStorage.getItem('news') || '[]');
            news.unshift({
                id: Date.now(),
                ...data,
                createdAt: new Date().toISOString()
            });
            
            localStorage.setItem('news', JSON.stringify(news));
            
            showNotification('News article published successfully!', 'success');
            e.target.reset();
            
            document.getElementById('addNewsModal').classList.remove('active');
            loadNews();
        });
    </script>
</body>
</html>
