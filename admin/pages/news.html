<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News & Updates | BKR Admin Panel</title>
    <link rel="stylesheet" href="../../css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="admin-container">
        <!-- Sidebar -->
        <aside class="admin-sidebar">
            <div class="sidebar-header">
                <h2>B<span>K</span>R</h2>
                <p>Admin Panel</p>
            </div>
            
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">
                    <i class="fas fa-tachometer-alt"></i>
                    <span>Dashboard</span>
                </a>
                <a href="health-camps.html" class="nav-item">
                    <i class="fas fa-heartbeat"></i>
                    <span>Health Camps</span>
                </a>
                <a href="gallery.html" class="nav-item">
                    <i class="fas fa-images"></i>
                    <span>Gallery</span>
                </a>
                <a href="news.html" class="nav-item active">
                    <i class="fas fa-newspaper"></i>
                    <span>News & Updates</span>
                </a>
                <a href="complaints.html" class="nav-item">
                    <i class="fas fa-exclamation-circle"></i>
                    <span>Complaints</span>
                </a>
                <a href="feedback.html" class="nav-item">
                    <i class="fas fa-comment-dots"></i>
                    <span>Feedback</span>
                </a>
                <a href="content.html" class="nav-item">
                    <i class="fas fa-edit"></i>
                    <span>Content</span>
                </a>
                <a href="settings.html" class="nav-item">
                    <i class="fas fa-cog"></i>
                    <span>Settings</span>
                </a>
            </nav>
            
            <div class="sidebar-footer">
                <a href="#" onclick="logout()">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Logout</span>
                </a>
            </div>
        </aside>
        
        <!-- Main Content -->
        <main class="admin-main">
            <!-- Header -->
            <header class="admin-header">
                <div class="header-left">
                    <h1>News & Updates</h1>
                    <p>Manage news articles and announcements</p>
                </div>
                <div class="header-right">
                    <button class="btn btn-secondary" data-modal="addNewsModal">
                        <i class="fas fa-plus"></i> Add News Article
                    </button>
                </div>
            </header>
            
            <!-- Content -->
            <div class="admin-content">
                <!-- Filters -->
                <div class="admin-card">
                    <div class="card-body">
                        <div style="display: flex; gap: 20px; align-items: center; flex-wrap: wrap;">
                            <div class="search-box">
                                <i class="fas fa-search"></i>
                                <input type="text" placeholder="Search news...">
                            </div>
                            <select class="form-control" style="width: auto;">
                                <option value="">All Categories</option>
                                <option value="announcement">Announcements</option>
                                <option value="event">Events</option>
                                <option value="press">Press Releases</option>
                                <option value="update">Updates</option>
                            </select>
                            <select class="form-control" style="width: auto;">
                                <option value="">All Status</option>
                                <option value="published">Published</option>
                                <option value="draft">Draft</option>
                            </select>
                        </div>
                    </div>
                </div>
                
                <!-- News Table -->
                <div class="admin-card">
                    <div class="card-header">
                        <h3>News Articles</h3>
                    </div>
                    <div class="card-body">
                        <table class="admin-table">
                            <thead>
                                <tr>
                                    <th>Title</th>
                                    <th>Category</th>
                                    <th>Date</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="newsTable">
                                <tr>
                                    <td colspan="5" style="text-align: center;">No news articles found.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Add News Modal -->
    <div class="modal-overlay" id="addNewsModal">
        <div class="modal" style="max-width: 700px;">
            <div class="modal-header">
                <h3>Add News Article</h3>
                <button class="modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <form id="newsForm">
                    <div class="form-group">
                        <label>Title *</label>
                        <input type="text" class="form-control" name="title" placeholder="Enter article title" required>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label>Category *</label>
                            <select class="form-control" name="category" required>
                                <option value="">Select Category</option>
                                <option value="announcement">Announcement</option>
                                <option value="event">Event</option>
                                <option value="press">Press Release</option>
                                <option value="update">Update</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Date *</label>
                            <input type="date" class="form-control" name="date" required>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label>Summary *</label>
                        <textarea class="form-control" name="summary" rows="3" placeholder="Brief summary of the article..." required></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label>Content *</label>
                        <textarea class="form-control" name="content" rows="8" placeholder="Full article content..." required></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label>Featured Image</label>
                        <div style="margin-bottom: 10px;">
                            <label class="btn btn-outline" style="cursor: pointer; display: inline-block;">
                                <i class="fas fa-upload"></i> Upload Image
                                <input type="file" id="imageUpload" accept="image/*" style="display: none;" onchange="handleImageUpload(event)">
                            </label>
                            <small style="color: #888; margin-left: 10px;">Or enter URL below (max 5MB)</small>
                        </div>
                        <input type="text" class="form-control" name="image" placeholder="https://example.com/image.jpg or upload above">
                    </div>
                    
                    <div class="form-group">
                        <label>Status</label>
                        <div style="display: flex; gap: 20px; margin-top: 10px;">
                            <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                                <input type="radio" name="status" value="published" checked>
                                <span>Published</span>
                            </label>
                            <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                                <input type="radio" name="status" value="draft">
                                <span>Draft</span>
                            </label>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline modal-cancel">Cancel</button>
                <button type="submit" form="newsForm" class="btn btn-secondary">
                    <i class="fas fa-plus"></i> Publish Article
                </button>
            </div>
        </div>
    </div>

    <script src="../../js/config.js"></script>
    <script src="../../js/api-service.js"></script>
    <script src="../../js/admin.js"></script>
    <script>
        // Check authentication
        if (localStorage.getItem('adminLoggedIn') !== 'true') {
            window.location.href = 'login.html';
        }
        
        function logout() {
            localStorage.removeItem('adminLoggedIn');
            localStorage.removeItem('adminUser');
            window.location.href = 'login.html';
        }
        
        let editingNewsId = null;
        
        document.addEventListener('DOMContentLoaded', async function() {
            await loadConfig();
            loadNews();
        });
        
        async function loadNews() {
            const container = document.getElementById('newsTable');
            
            try {
                const response = await fetch('/api/news?status=', {
                    method: 'GET'
                });
                
                const result = await response.json();
                
                if (result.success && result.data.length > 0) {
                    container.innerHTML = result.data.map(item => {
                        const date = new Date(item.date).toLocaleDateString();
                        return `
                        <tr>
                            <td>
                                ${item.image_url ? `<img src="${item.image_url}" alt="${item.title}" style="width: 50px; height: 50px; object-fit: cover; border-radius: 5px; margin-right: 10px; vertical-align: middle;">` : ''}
                                <strong>${item.title}</strong>
                            </td>
                            <td><span class="badge badge-primary">${item.category}</span></td>
                            <td>${date}</td>
                            <td>
                                <span class="badge ${item.status === 'published' ? 'badge-success' : 'badge-warning'}">
                                    ${item.status === 'published' ? 'Published' : 'Draft'}
                                </span>
                            </td>
                            <td class="actions">
                                <button class="btn btn-sm btn-info" onclick="viewNews(${item.id})" title="View">
                                    <i class="fas fa-eye"></i>
                                </button>
                                <button class="btn btn-sm btn-primary" onclick="editNews(${item.id})" title="Edit">
                                    <i class="fas fa-edit"></i>
                                </button>
                                <button class="btn btn-sm btn-danger" onclick="deleteNews(${item.id})" title="Delete">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </td>
                        </tr>
                    `;
                    }).join('');
                } else {
                    container.innerHTML = '<tr><td colspan="5" style="text-align:center;">No news articles found. Add a new article to get started.</td></tr>';
                }
            } catch (error) {
                console.error('Error loading news:', error);
                showNotification('Error loading news articles', 'error');
                container.innerHTML = '<tr><td colspan="5" style="text-align:center; color: red;">Error loading news articles</td></tr>';
            }
        }
        
        async function deleteNews(id) {
            if (!confirm('Are you sure you want to delete this news article?')) return;
            
            try {
                const response = await fetch(`/api/news/${id}`, {
                    method: 'DELETE',
                    headers: {
                        'X-API-Key': getApiKey()
                    }
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showNotification('News article deleted successfully!', 'success');
                    loadNews();
                } else {
                    showNotification(result.error || 'Failed to delete article', 'error');
                }
            } catch (error) {
                console.error('Error deleting news:', error);
                showNotification('Error deleting news article', 'error');
            }
        }
        
        async function editNews(id) {
            try {
                const response = await fetch(`/api/news/${id}`);
                const result = await response.json();
                
                if (result.success) {
                    const news = result.data;
                    editingNewsId = id;
                    
                    // Populate form
                    document.querySelector('[name="title"]').value = news.title;
                    document.querySelector('[name="category"]').value = news.category;
                    document.querySelector('[name="date"]').value = news.date;
                    document.querySelector('[name="summary"]').value = news.summary || '';
                    document.querySelector('[name="content"]').value = news.content;
                    document.querySelector('[name="image"]').value = news.image_url || '';
                    document.querySelector(`[name="status"][value="${news.status}"]`).checked = true;
                    
                    // Update modal title
                    document.querySelector('#addNewsModal .modal-header h3').textContent = 'Edit News Article';
                    document.querySelector('#addNewsModal button[type="submit"]').innerHTML = '<i class="fas fa-save"></i> Update Article';
                    
                    // Open modal
                    document.getElementById('addNewsModal').classList.add('active');
                } else {
                    showNotification(result.error || 'Failed to load article', 'error');
                }
            } catch (error) {
                console.error('Error loading news:', error);
                showNotification('Error loading news article', 'error');
            }
        }
        
        function viewNews(id) {
            // Open article in new tab or show in modal
            window.open(`/pages/news-detail.html?id=${id}`, '_blank');
        }
        
        // Handle modal open for new article
        document.querySelector('[data-modal="addNewsModal"]').addEventListener('click', function() {
            editingNewsId = null;
            document.getElementById('newsForm').reset();
            document.querySelector('#addNewsModal .modal-header h3').textContent = 'Add News Article';
            document.querySelector('#addNewsModal button[type="submit"]').innerHTML = '<i class="fas fa-plus"></i> Publish Article';
            document.getElementById('addNewsModal').classList.add('active');
        });
        
        // Form submission
        document.getElementById('newsForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = new FormData(e.target);
            const data = {
                title: formData.get('title'),
                category: formData.get('category'),
                summary: formData.get('summary'),
                content: formData.get('content'),
                image_url: formData.get('image') || '',
                status: formData.get('status'),
                date: formData.get('date')
            };
            
            try {
                const url = editingNewsId ? `/api/news/${editingNewsId}` : '/api/news';
                const method = editingNewsId ? 'PUT' : 'POST';
                
                const response = await fetch(url, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json',
                        'X-API-Key': getApiKey()
                    },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showNotification(editingNewsId ? 'News article updated successfully!' : 'News article published successfully!', 'success');
                    e.target.reset();
                    document.getElementById('addNewsModal').classList.remove('active');
                    editingNewsId = null;
                    loadNews();
                } else {
                    showNotification(result.error || 'Failed to save article', 'error');
                }
            } catch (error) {
                console.error('Error saving news:', error);
                showNotification('Error saving news article', 'error');
            }
        });
        
        // Handle image file upload
        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            // Validate file type
            if (!file.type.startsWith('image/')) {
                showNotification('Please select an image file', 'error');
                return;
            }
            
            // Validate file size (max 5MB)
            if (file.size > 5 * 1024 * 1024) {
                showNotification('Image must be less than 5MB', 'error');
                return;
            }
            
            // Create form data for upload
            const formData = new FormData();
            formData.append('file', file);
            
            // Show uploading state
            const imageInput = document.querySelector('[name="image"]');
            const originalValue = imageInput.value;
            imageInput.value = 'Uploading...';
            imageInput.disabled = true;
            
            // Upload to server (you'll need to implement this endpoint)
            fetch('/api/upload', {
                method: 'POST',
                headers: {
                    'X-API-Key': getApiKey()
                },
                body: formData
            })
            .then(response => response.json())
            .then(result => {
                if (result.success) {
                    imageInput.value = result.url;
                    showNotification('Image uploaded successfully!', 'success');
                } else {
                    imageInput.value = originalValue;
                    showNotification(result.error || 'Upload failed', 'error');
                }
            })
            .catch(error => {
                console.error('Upload error:', error);
                imageInput.value = originalValue;
                showNotification('Error uploading image', 'error');
            })
            .finally(() => {
                imageInput.disabled = false;
            });
        }
    </script>
</body>
</html>
